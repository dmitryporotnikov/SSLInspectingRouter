name: Release

# Builds the linux/amd64 router binary and publishes it to a rolling
# "latest" GitHub Release on every push to main (including merged PRs).
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Release uploads must not race when several merges land in quick succession.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build linux/amd64 binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" \
            -o dist/sslinspectingrouter-linux-amd64 ./cmd/router

      - name: Generate SHA256 checksum
        working-directory: dist
        run: sha256sum sslinspectingrouter-linux-amd64 > sslinspectingrouter-linux-amd64.sha256

      - name: Publish rolling "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="latest"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TITLE="Latest main build (${SHORT_SHA})"
          NOTES="Automated linux/amd64 build of commit ${GITHUB_SHA}."

          # Recreate the rolling release so the tag always points at the
          # commit that produced the attached binary.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release delete "${TAG}" --yes --cleanup-tag
          fi

          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "${TITLE}" \
            --notes "${NOTES}" \
            --prerelease \
            dist/sslinspectingrouter-linux-amd64 \
            dist/sslinspectingrouter-linux-amd64.sha256
